apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops-cats-dogs-staging

resources:
  - ../base

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: cats-dogs-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "DEBUG"
    patchType: json
