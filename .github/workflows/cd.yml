name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KIND_CLUSTER_NAME: mlops-cluster
  ARGOCD_VERSION: stable

jobs:
  build-push:
    name: Build & Push Image
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_SHA::8}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in K8s manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|image: ghcr.io/.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}|g" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: update image tag to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push || echo "Push failed or nothing to push"

  deploy-argocd:
    name: Deploy via Argo CD (GitOps)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
              - role: control-plane
                kubeadmConfigPatches:
                  - |
                    kind: InitConfiguration
                    nodeRegistration:
                      kubeletExtraArgs:
                        node-labels: "ingress-ready=true"
                extraPortMappings:
                  - containerPort: 80
                    hostPort: 80
                    protocol: TCP
                  - containerPort: 443
                    hostPort: 443
                    protocol: TCP

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/${{ env.ARGOCD_VERSION }}/manifests/install.yaml
          kubectl wait --for=condition=available deployment/argocd-server \
            -n argocd --timeout=300s
          echo "Argo CD installed successfully"

      - name: Install Argo CD CLI and configure
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          sleep 10
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
          echo "ARGOCD_PASSWORD=$ARGOCD_PASSWORD" >> $GITHUB_ENV
          argocd login localhost:8080 --username admin --password "$ARGOCD_PASSWORD" --insecure --grpc-web

      - name: Create Argo CD Project and Application
        run: |
          kubectl apply -f argocd/project.yaml || true
          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cats-dogs-api-production
            namespace: argocd
            labels:
              app.kubernetes.io/part-of: cats-dogs-mlops
              environment: production
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: cats-dogs-mlops
            source:
              repoURL: https://github.com/${{ github.repository }}.git
              targetRevision: main
              path: k8s
            destination:
              server: https://kubernetes.default.svc
              namespace: mlops-cats-dogs
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
              retry:
                limit: 3
                backoff:
                  duration: 5s
                  factor: 2
                  maxDuration: 1m
          EOF

      - name: Sync Argo CD Application
        run: |
          sleep 15
          argocd app sync cats-dogs-api-production --force || true
          argocd app wait cats-dogs-api-production --timeout 300 || true
          echo "Argo CD sync complete"

      - name: Verify deployment
        run: |
          echo "=== Argo CD Application Status ==="
          argocd app get cats-dogs-api-production || true
          echo ""
          echo "=== K8s Resources ==="
          kubectl get pods -n mlops-cats-dogs
          kubectl get svc -n mlops-cats-dogs

      - name: Smoke tests
        run: |
          kubectl port-forward -n mlops-cats-dogs svc/cats-dogs-api 8000:8000 &
          PORT_FORWARD_PID=$!
          sleep 10

          HEALTH_OK=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Health check passed"
              HEALTH_OK=true
              break
            fi
            echo "Waiting for health endpoint... ($i/30)"
            sleep 2
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "Health check failed"
            kill $PORT_FORWARD_PID 2>/dev/null || true
            exit 1
          fi

          echo "Testing prediction endpoint..."
          python3 -c "
          from PIL import Image
          import io, base64
          img = Image.new('RGB', (224, 224), color='red')
          buf = io.BytesIO()
          img.save(buf, format='JPEG')
          print(base64.b64encode(buf.getvalue()).decode())
          " > /tmp/test_image.b64

          PREDICTION=$(curl -s -X POST http://localhost:8000/predict/base64 \
            -H "Content-Type: application/json" \
            -d "{\"image_base64\": \"$(cat /tmp/test_image.b64)\"}")

          echo "Prediction response: $PREDICTION"

          if echo "$PREDICTION" | grep -q "class_name"; then
            echo "Prediction test passed"
          else
            echo "Prediction test failed"
            kill $PORT_FORWARD_PID 2>/dev/null || true
            exit 1
          fi

          kill $PORT_FORWARD_PID 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f "kubectl port-forward" || true
