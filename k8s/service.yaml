apiVersion: v1
kind: Service
metadata:
  name: cats-dogs-api
  namespace: mlops-cats-dogs
  labels:
    app: cats-dogs-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: cats-dogs-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cats-dogs-api
  namespace: mlops-cats-dogs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cats-dogs.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cats-dogs-api
                port:
                  number: 8000